# Alembic configuration. Run from the database/ directory:
#   alembic upgrade head
#   alembic revision --autogenerate -m "<message>"
# The database URL is NOT stored here — it is assembled from environment
# variables (POSTGRES_*) in alembic/env.py, so no credentials live in Git.

[alembic]
script_location = alembic
prepend_sys_path = ../services/api
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
