name: expense_tracker
description: Cross-platform expense tracker (Android, iOS, tablet, web).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # HTTP client
  dio: ^5.7.0
  # Secure token storage (Keychain/Keystore); falls back to web storage on web
  flutter_secure_storage: ^9.2.2
  # Charts
  fl_chart: ^0.69.0
  # Formatting
  intl: ^0.19.0
  # Routing
  go_router: ^14.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
