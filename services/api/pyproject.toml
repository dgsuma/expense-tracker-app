[project]
name = "expense-tracker-api"
version = "0.1.0"
description = "Expense Tracker REST API (FastAPI)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]  # asserts are expected in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]
