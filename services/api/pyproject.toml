[project]
name = "expense-tracker-api"
version = "0.1.0"
description = "Expense Tracker REST API (FastAPI)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
show_missing = true
# Unit tests (no DB) currently reach ~69%. The DB-dependent repositories and
# services are covered by integration tests (tests/test_auth.py and the Phase 4/5
# endpoint tests), which run in CI where a database is available. The CI gate
# enforces ≥80% on the combined unit + integration run.
fail_under = 65

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]  # asserts are expected in tests

[tool.ruff.lint.per-file-ignores]
# Depends() in argument defaults is the idiomatic FastAPI dependency pattern.
"app/api/**/*.py" = ["B008"]
# Test fixtures use hardcoded credentials and token-type strings, not real secrets.
"tests/**/*.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
