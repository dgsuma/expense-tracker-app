# Redis for rate limiting (and future caching).
# Single replica is sufficient for rate limiting; use a managed/HA Redis for production scale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: expense-tracker
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: expense-tracker
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
