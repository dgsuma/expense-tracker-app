apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: expense-tracker
  labels:
    app: api
spec:
  # Single replica: DB migrations run in an initContainer tied to the rollout.
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Run Alembic migrations before the API starts, using the SAME immutable
      # image. Receives the same ConfigMap/Secret env as the app container.
      initContainers:
        - name: db-migrate
          image: expense-tracker-api:latest  # replaced by Kustomize image override
          imagePullPolicy: IfNotPresent
          workingDir: /app/database
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: expense-tracker-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secrets
                  key: POSTGRES_PASSWORD
      containers:
        - name: api
          image: expense-tracker-api:latest  # replaced by Kustomize image override
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: expense-tracker-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secrets
                  key: JWT_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: expense-tracker
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
