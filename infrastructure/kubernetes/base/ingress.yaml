# Private ingress via the Tailscale Kubernetes Operator.
# The app is reachable ONLY over the tailnet at a MagicDNS HTTPS URL
# (https://expense-tracker.<tailnet>.ts.net). No public ingress, no Funnel.
# Traffic enters the web service; the web nginx proxies /api/ to the API
# service internally, so only the web backend is exposed here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expense-tracker
  namespace: expense-tracker
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: web
      port:
        number: 8080
  tls:
    - hosts:
        - expense-tracker  # MagicDNS hostname on the tailnet
