apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: expense-tracker

resources:
  - ../../base

# Production images are published to private GHCR.
# Jenkins/Flux will deploy immutable tags such as <short-sha>-<build-number>.
images:
  - name: expense-tracker-api
    newName: ghcr.io/dgsuma/expense-tracker-api
    newTag: "0.1.0"

  - name: expense-tracker-web
    newName: ghcr.io/dgsuma/expense-tracker-web
    newTag: "0.1.0"

# Allow Kubernetes to pull the private API and web images from GHCR.
# The ghcr-pull Secret itself is created directly in the cluster and is
# intentionally NOT committed to Git.
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
